<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle animated grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes waveScan {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarBeam {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-orb {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .animated-wave {
        stroke-dasharray: 400;
        animation: waveScan 10s linear infinite;
      }
      .foreground-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Orbs (Background depth layer) -->
  <g class="floating-orb" opacity="0.4">
    <circle cx="200" cy="120" r="160" fill="url(#glowGrad)" filter="url(#glow)" />
    <circle cx="1020" cy="300" r="180" fill="url(#glowGrad)" filter="url(#glow)" />
  </g>

  <!-- Ambient Wave Graphic in Background -->
  <path class="animated-wave" d="M -50,340 C 250,260 450,390 750,310 C 950,250 1100,350 1250,300" fill="none" stroke="url(#accentCyanPurple)" stroke-width="2.5" stroke-opacity="0.3" />
  <path class="animated-wave" d="M -50,370 C 200,310 500,410 800,330 C 1000,280 1150,360 1250,330" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- TV Display Screen Frame Decoration (Right Side) -->
  <g transform="translate(860, 60)" filter="url(#shadow)">
    <!-- TV Outer Casing -->
    <rect x="0" y="0" width="280" height="180" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
    <!-- TV Inner Screen Display -->
    <rect x="10" y="10" width="260" height="150" rx="8" fill="#020617" />
    
    <!-- Video Player Interface Mockup inside TV Screen -->
    <path d="M 25,35 L 255,35" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="35" cy="35" r="4" fill="#38bdf8" />
    <circle cx="50" cy="35" r="4" fill="#818cf8" />
    <circle cx="65" cy="35" r="4" fill="#34d399" />
    
    <!-- Central Play / Mod Symbol -->
    <polygon points="130,70 130,110 165,90" fill="url(#accentCyanPurple)" filter="url(#glow)"/>
    
    <!-- Screen Sub-bars -->
    <rect x="25" y="130" width="130" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="130" width="75" height="8" rx="4" fill="#38bdf8" />
    <rect x="170" y="130" width="75" height="8" rx="4" fill="#334155" />
    
    <!-- TV Stand -->
    <polygon points="120,180 160,180 170,215 110,215" fill="#1e293b" />
    <rect x="90" y="215" width="100" height="6" rx="3" fill="#334155" />
  </g>

  <!-- FOREGROUND: Clean Hero Content & Typography (Guaranteed Top Layer) -->
  <g class="foreground-text" transform="translate(80, 0)">
    
    <!-- Tagline Badge / Pill -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="21" fill="#e2e8f0" font-size="12.5" font-weight="700" letter-spacing="1">CURATED FOSS COLLECTION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Home Entertainment
    </text>
    
    <!-- Gradient Sub-Title -->
    <text x="0" y="200" fill="url(#accentCyanPurple)" font-size="34" font-weight="700">
      &amp; TV Modding Utilities
    </text>

    <!-- Description / Value Proposition -->
    <text x="0" y="248" fill="#94a3b8" font-size="16.5" font-weight="400">
      Top open-source media servers, debloaters, custom launchers, ad-free streaming clients,
    </text>
    <text x="0" y="274" fill="#94a3b8" font-size="16.5" font-weight="400">
      and HTPC operating systems for Android TV, webOS, Tizen, Fire TV &amp; Linux.
    </text>

    <!-- Interactive Category Feature Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1: Media Servers -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="38" rx="19" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
        <text x="20" y="24" fill="#38bdf8" font-size="14" font-weight="600">📺 Media Servers</text>
      </g>

      <!-- Pill 2: TV Modding & ADB -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="180" height="38" rx="19" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
        <text x="18" y="24" fill="#c084fc" font-size="14" font-weight="600">🛠️ TV Modding &amp; ADB</text>
      </g>

      <!-- Pill 3: Ad-Free Clients -->
      <g transform="translate(370, 0)">
        <rect x="0" y="0" width="170" height="38" rx="19" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
        <text x="18" y="24" fill="#f472b6" font-size="14" font-weight="600">🛡️ Ad-Free Clients</text>
      </g>

      <!-- Pill 4: HTPC & DVR -->
      <g transform="translate(555, 0)">
        <rect x="0" y="0" width="165" height="38" rx="19" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <text x="18" y="24" fill="#34d399" font-size="14" font-weight="600">🚀 HTPC OS &amp; DVR</text>
      </g>
    </g>

  </g>
</svg>
